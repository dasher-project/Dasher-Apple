name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only DasherMac is built here. It is distributed by direct download (not via
# the App Store / TestFlight), so it has no other build validation — this
# per-PR build is its CI gate. iOS (DasherApp) and visionOS are validated by
# Xcode Cloud / TestFlight, so building them here would duplicate that and
# surface asset/config issues that don't affect the real distribution builds.
jobs:
  build:
    name: Build (DasherMac)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Guard bundled engine data against drift
        run: |
          # The curated DasherEngine/Resources/Data copy caused the
          # palette-fills regression (legacy-only palettes shipped while the
          # engine consolidated to v6). Fail the build if it drifts again.
          diff -rq DasherCore/Data/colours DasherEngine/Resources/Data/colours --exclude=Makefile.am --exclude='*.py' --exclude='*.dtd'
          diff -rq DasherCore/Data/control DasherEngine/Resources/Data/control --exclude=Makefile.am

      - name: Guard Localizable.xcstrings against shared catalogue drift (RFC 0003)
        run: python3 Localization/gen-from-shared.py --check

      - name: Run DasherShared unit tests
        run: swift test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Select newest Xcode 27 (icon-rendering parity with local builds)
        run: |
          for X in Xcode_27.2 Xcode_27.1 Xcode_27.0 Xcode_27; do
            if [ -d "/Applications/$X.app" ]; then
              echo "Selecting $X"
              sudo xcode-select -s "/Applications/$X.app"
              xcodebuild -version
              exit 0
            fi
          done
          echo "::warning::No Xcode 27 found - building with $(xcodebuild -version | head -1)"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Dasher.xcodeproj \
            -scheme DasherMac \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
