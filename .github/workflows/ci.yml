name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only DasherMac is built here. It is distributed by direct download (not via
# the App Store / TestFlight), so it has no other build validation — this
# per-PR build is its CI gate. iOS (DasherApp) and visionOS are validated by
# Xcode Cloud / TestFlight, so building them here would duplicate that and
# surface asset/config issues that don't affect the real distribution builds.
jobs:
  build:
    name: Build (DasherMac)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Dasher.xcodeproj \
            -scheme DasherMac \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
