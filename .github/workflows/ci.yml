name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only DasherMac is built here. It is distributed by direct download (not via
# the App Store / TestFlight), so it has no other build validation — this
# per-PR build is its CI gate. iOS (DasherApp) and visionOS are validated by
# Xcode Cloud / TestFlight, so building them here would duplicate that and
# surface asset/config issues that don't affect the real distribution builds.
jobs:
  build:
    name: Build (DasherMac)
    # xcode-27 image: GH ships one Xcode major per macOS image, so macos-latest
    # (macOS 26) carries only Xcode 26.x — whose SDK distorts toolbar icons
    # (#65/#67). Preview label today; the toolchain guard below fails loudly if
    # the image rotates away from Xcode 27.
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: CAPI compatibility gate (RFC 0023 item 3)
        run: Scripts/check-capi.sh

      - name: Guard bundled engine data against drift
        run: |
          # The curated DasherEngine/Resources/Data copy caused the
          # palette-fills regression (legacy-only palettes shipped while the
          # engine consolidated to v6). Fail the build if it drifts again.
          diff -rq DasherCore/Data/colours DasherEngine/Resources/Data/colours --exclude=Makefile.am --exclude='*.py' --exclude='*.dtd'
          diff -rq DasherCore/Data/control DasherEngine/Resources/Data/control --exclude=Makefile.am

      - name: Guard Localizable.xcstrings against shared catalogue drift (RFC 0003)
        run: python3 Localization/gen-from-shared.py --check

      - name: Run DasherShared unit tests
        run: swift test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Require Xcode 27+ (stretched-icon toolchain guard, #67)
        run: |
          # Same contract as mac-release.yml: SDK 26.5 distorts toolbar
          # icon metrics (#65/#67) — green CI on the wrong toolchain is
          # worthless. Fail if the runner lacks Xcode 27+.
          BEST=""
          for APP in /Applications/Xcode*.app; do
            [ -d "$APP" ] || continue
            MAJOR=$(DEVELOPER_DIR="$APP/Contents/Developer" xcodebuild -version 2>/dev/null | head -1 | sed 's/[^0-9]*//;s/\..*//')
            if [ -n "$MAJOR" ] && [ "$MAJOR" -ge 27 ]; then BEST="$APP"; fi
          done
          if [ -z "$BEST" ]; then
            echo "::error::No Xcode 27+ installed on this runner (stretched-icon toolchain regression, #65/#67). Pin runs-on to an image that ships Xcode 27."
            exit 1
          fi
          echo "DEVELOPER_DIR=$BEST/Contents/Developer" >> "$GITHUB_ENV"

      - name: Toolchain info
        run: xcode-select -p && xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Dasher.xcodeproj \
            -scheme DasherMac \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
