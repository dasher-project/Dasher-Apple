name: macOS Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-release:
    # xcode-27 image: GH ships one Xcode major per macOS image, so macos-latest
    # (macOS 26) carries only Xcode 26.x — whose SDK distorts toolbar icons
    # (#65/#67, v6.0.0-rc.1 regression). Preview label today; the toolchain
    # guard below fails loudly if the image rotates away from Xcode 27.
    runs-on: xcode-27
    # Export normally completes in under a minute; if signing hangs again,
    # fail loudly instead of burning hours of runner time.
    timeout-minutes: 45
    steps:
      - name: Reject tags outside the RFC 0023 §1 scheme
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Aligned scheme: vMAJOR.MINOR.PATCH with MAJOR >= 6, optional -rc.N.
          # Retires the -mac-beta suffix and blocks legacy/odd tags from
          # triggering releases with wrong-looking DMG names.
          if ! [[ "$REF_NAME" =~ ^v(6|[7-9]|[1-9][0-9]+)\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$REF_NAME' does not match the RFC 0023 §1 scheme (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N). The -mac-beta suffix is retired."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history + tags: versions derive from git describe (RFC 0023 §1).
          fetch-depth: 0

      - name: Derive version from tag (RFC 0023 §1)
        run: |
          eval "$("$GITHUB_WORKSPACE/Scripts/version-from-tag.sh")"
          echo "Building version $MARKETING_VERSION ($CURRENT_PROJECT_VERSION)"
          {
            echo "MARKETING_VERSION=$MARKETING_VERSION"
            echo "CURRENT_PROJECT_VERSION=$CURRENT_PROJECT_VERSION"
          } >> "$GITHUB_ENV"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Require Xcode 27+ (stretched-icon toolchain guard, #67)
        run: |
          # The square-raster fix (#65) does NOT hold on Xcode 26.6/SDK 26.5:
          # v0.1.15 contained it and still shipped stretched toolbar icons.
          # Xcode 27 renders correctly (verified locally, #67). The #68
          # "repair" dropped the selection entirely, so v6.0.0-rc.1 silently
          # rebuilt with Xcode_26.6 — this guard makes that impossible: pick
          # the newest installed Xcode 27+ or fail the release loudly.
          BEST=""
          for APP in /Applications/Xcode*.app; do
            [ -d "$APP" ] || continue
            MAJOR=$(DEVELOPER_DIR="$APP/Contents/Developer" xcodebuild -version 2>/dev/null | head -1 | sed 's/[^0-9]*//;s/\..*//')
            if [ -n "$MAJOR" ] && [ "$MAJOR" -ge 27 ]; then BEST="$APP"; fi
          done
          if [ -z "$BEST" ]; then
            echo "::error::No Xcode 27+ installed on this runner. Release builds must not use the Xcode 26.6/SDK 26.5 toolchain (stretched toolbar icons regression, #65/#67). Pin runs-on to an image that ships Xcode 27 (e.g. macos-26)."
            exit 1
          fi
          echo "DEVELOPER_DIR=$BEST/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $BEST"

      - name: Toolchain info
        run: |
          xcodebuild -version
          VER=$(xcodebuild -version | head -1 | sed 's/[^0-9]*//;s/\..*//')
          if [ "$VER" -lt 27 ]; then
            echo "::error::Build would run on Xcode $VER — SDK 26.5 distorts toolbar icon metrics (#65/#67)."
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          MAC_DEVELOPER_ID_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_PASSWORD }}
        run: |
          KEYCHAIN=/tmp/build.keychain-db
          echo "$MAC_DEVELOPER_ID_P12" | base64 --decode > /tmp/dev-id.p12
          security create-keychain -p temp123 $KEYCHAIN
          security unlock-keychain -p temp123 $KEYCHAIN
          security import /tmp/dev-id.p12 -k $KEYCHAIN -P "$MAC_DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign:,xcodebuild: -s -k temp123 $KEYCHAIN
          # Add to search list so export step can find the identity
          security list-keychains -d user -s $KEYCHAIN $(security list-keychains -d user | tr -d '"')
          rm /tmp/dev-id.p12

      - name: Write ASC API key for notarization
        env:
          ASC_API_KEY_PRIVATE_KEY: ${{ secrets.ASC_API_KEY_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_PRIVATE_KEY" > ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

      - name: Archive
        run: |
          xcodebuild archive \
            -project Dasher.xcodeproj \
            -scheme DasherMac \
            -configuration Release \
            -archivePath build/Dasher.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.MAC_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="-" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"

      - name: Export
        env:
          MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
        run: |
          cat > /tmp/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>${MAC_TEAM_ID}</string>
              <!-- Manual signing: automatic style (used through v0.1.8) hung the
                   v0.1.9 export for 2h+ in CI — xcodebuild's automatic identity
                   resolution can block on an interactive/cloud-signing prompt
                   that nobody can dismiss headless. Pin the certificate so no
                   resolution step runs at all. -->
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Developer ID Application</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Dasher.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /tmp/exportOptions.plist

      - name: Re-sign with Developer ID + inject icon
        run: |
          APP="build/export/Dasher.app"

          # Copy pre-compiled .icns (generated locally from the .icon file)
          cp DasherMac/Resources/DasherIcon.icns "$APP/Contents/Resources/DasherIcon.icns"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile DasherIcon.icns" "$APP/Contents/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string DasherIcon.icns" "$APP/Contents/Info.plist"

          # Re-sign the entire app with Developer ID + Hardened Runtime (required for notarization)
          codesign --force --deep --sign "Developer ID Application: Will Wade (TRKU383G7Z)" \
            --entitlements DasherMac/DasherMac.entitlements \
            --options runtime \
            "$APP"

          # Verify
          codesign -dv "$APP" 2>&1 | head -5

      - name: Notarize and staple app
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER: ${{ secrets.ASC_API_KEY_ISSUER }}
        run: |
          # Submit the .app for notarization. --wait blocks until processing completes.
          ditto -c -k --keepParent build/export/Dasher.app /tmp/Dasher.zip
          xcrun notarytool submit \
            /tmp/Dasher.zip \
            --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_API_KEY_ISSUER" \
            --key ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8 \
            --wait
          # Stapling is best-effort — if it fails, the notarization is still valid,
          # macOS just verifies online on first launch instead of via the stapled ticket.
          xcrun stapler staple build/export/Dasher.app || echo "WARN: Stapling failed — notarization still valid, will verify online"

      - name: Create DMG
        run: |
          hdiutil create -volname "Dasher" \
            -srcfolder build/export/Dasher.app \
            -ov -format UDZO \
            build/Dasher-${{ github.ref_name }}.dmg

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Dasher-${{ github.ref_name }}.dmg
          generate_release_notes: true
          # RFC 0023 §1: -rc.N tags are prereleases — don't mark them "Latest".
          prerelease: ${{ contains(github.ref_name, '-rc.') }}

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain /tmp/build.keychain || true
          rm -rf ~/private_keys
