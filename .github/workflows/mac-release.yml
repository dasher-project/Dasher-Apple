name: macOS Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-latest
    # Export normally completes in under a minute; if signing hangs again,
    # fail loudly instead of burning hours of runner time.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import Developer ID certificate
        env:
          MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          MAC_DEVELOPER_ID_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_PASSWORD }}
        run: |
          KEYCHAIN=/tmp/build.keychain-db
          echo "$MAC_DEVELOPER_ID_P12" | base64 --decode > /tmp/dev-id.p12
          security create-keychain -p temp123 $KEYCHAIN
          security unlock-keychain -p temp123 $KEYCHAIN
          security import /tmp/dev-id.p12 -k $KEYCHAIN -P "$MAC_DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign:,xcodebuild: -s -k temp123 $KEYCHAIN
          # Add to search list so export step can find the identity
          security list-keychains -d user -s $KEYCHAIN $(security list-keychains -d user | tr -d '"')
          rm /tmp/dev-id.p12

      - name: Write ASC API key for notarization
        env:
          ASC_API_KEY_PRIVATE_KEY: ${{ secrets.ASC_API_KEY_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_PRIVATE_KEY" > ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

      - name: Archive
        run: |
          xcodebuild archive \
            -project Dasher.xcodeproj \
            -scheme DasherMac \
            -configuration Release \
            -archivePath build/Dasher.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.MAC_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="-"

      - name: Export
        env:
          MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
        run: |
          cat > /tmp/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>${MAC_TEAM_ID}</string>
              <!-- Manual signing: automatic style (used through v0.1.8) hung the
                   v0.1.9 export for 2h+ in CI — xcodebuild's automatic identity
                   resolution can block on an interactive/cloud-signing prompt
                   that nobody can dismiss headless. Pin the certificate so no
                   resolution step runs at all. -->
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Developer ID Application</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Dasher.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /tmp/exportOptions.plist

      - name: Re-sign with Developer ID + inject icon
        run: |
          APP="build/export/Dasher.app"

          # Copy pre-compiled .icns (generated locally from the .icon file)
          cp DasherMac/Resources/DasherIcon.icns "$APP/Contents/Resources/DasherIcon.icns"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile DasherIcon.icns" "$APP/Contents/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string DasherIcon.icns" "$APP/Contents/Info.plist"

          # Re-sign the entire app with Developer ID + Hardened Runtime (required for notarization)
          codesign --force --deep --sign "Developer ID Application: Will Wade (TRKU383G7Z)" \
            --entitlements DasherMac/DasherMac.entitlements \
            --options runtime \
            "$APP"

          # Verify
          codesign -dv "$APP" 2>&1 | head -5

      - name: Notarize and staple app
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER: ${{ secrets.ASC_API_KEY_ISSUER }}
        run: |
          # Submit the .app for notarization. --wait blocks until processing completes.
          ditto -c -k --keepParent build/export/Dasher.app /tmp/Dasher.zip
          xcrun notarytool submit \
            /tmp/Dasher.zip \
            --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_API_KEY_ISSUER" \
            --key ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8 \
            --wait
          # Stapling is best-effort — if it fails, the notarization is still valid,
          # macOS just verifies online on first launch instead of via the stapled ticket.
          xcrun stapler staple build/export/Dasher.app || echo "WARN: Stapling failed — notarization still valid, will verify online"

      - name: Create DMG
        run: |
          hdiutil create -volname "Dasher" \
            -srcfolder build/export/Dasher.app \
            -ov -format UDZO \
            build/Dasher-${{ github.ref_name }}.dmg

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Dasher-${{ github.ref_name }}.dmg
          generate_release_notes: true

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain /tmp/build.keychain || true
          rm -rf ~/private_keys
