name: Dasher
options:
  bundleIdPrefix: at.dasher.Dasher
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    visionOS: "1.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  fileTypes:
    "icon":
      file: true
      fileType: folder.iconcomposer.icon

packages:
  DasherShared:
    path: .
  DasherSpeech:
    path: .
  SwiftTTSWrapper:
    url: https://github.com/aactools/swift-tts-wrapper
    from: "1.2.0"

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    DEVELOPMENT_TEAM: TRKU383G7Z
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targetTemplates:
  DasherCoreTemplate:
    type: library.static
    sources:
      - path: DasherCore/src
        excludes:
          - "**/CannaConversionHelper.*"
          - "**/SocketInputBase.*"
          - "**/SocketInput.*"
          - "**/*.h"
          - "**/original_harness.c"
          - "**/harness.c"
      - path: DasherCore/src/dasher.h
    settings:
      base:
        PRODUCT_NAME: DasherCore
        GCC_PREPROCESSOR_DEFINITIONS:
          - HAVE_ROUND=1
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/DasherCore/src"
          - "$(SRCROOT)/DasherCore/src/DasherCore"
          - "$(SRCROOT)/DasherCore/Thirdparty/pugixml/src"

  PugixmlTemplate:
    type: library.static
    sources:
      - path: DasherCore/Thirdparty/pugixml/src
        includes:
          - "pugixml.cpp"
    settings:
      base:
        PRODUCT_NAME: pugixml

targets:
  pugixml_ios:
    platform: iOS
    templates: [PugixmlTemplate]

  pugixml_macos:
    platform: macOS
    templates: [PugixmlTemplate]

  pugixml_visionos:
    platform: visionOS
    templates: [PugixmlTemplate]

  DasherCore_ios:
    platform: iOS
    templates: [DasherCoreTemplate]
    dependencies:
      - target: pugixml_ios

  DasherCore_macos:
    platform: macOS
    templates: [DasherCoreTemplate]
    dependencies:
      - target: pugixml_macos

  DasherCore_visionos:
    platform: visionOS
    templates: [DasherCoreTemplate]
    dependencies:
      - target: pugixml_visionos

  DasherApp:
    type: application
    platform: iOS
    sources:
      - path: DasherApp
        excludes:
          - "**/.gitkeep"
      - path: DasherIcon.icon
        buildPhase: resources
      - path: DasherEngine/Resources/Data
        buildPhase: resources
        type: folder
    dependencies:
      - target: DasherCore_ios
        link: true
      - target: pugixml_ios
        link: true
      - target: DasherKeyboard
        embed: true
      - package: DasherShared
        product: DasherShared
      - package: DasherSpeech
        product: DasherSpeech
    preBuildScripts:
      - name: Copy Locale Strings
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "${SRCROOT}/DasherEngine/Resources/Data/Strings"
          cp -f "${SRCROOT}/DasherCore/Strings/"*.json "${SRCROOT}/DasherEngine/Resources/Data/Strings/"
    settings:
      base:
        PRODUCT_NAME: "Dasher"
        PRODUCT_BUNDLE_IDENTIFIER: at.dasher.Dasher
        INFOPLIST_FILE: DasherApp/Info.plist
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: DasherIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TRKU383G7Z
        OTHER_LDFLAGS:
          - "-lc++"
          - "-lspeechmarkdown_rust"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/DasherCore/src"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]:
          - "$(BUILD_DIR)/../../SourcePackages/artifacts/speechmarkdown-rust/SpeechMarkdownRust/ios-arm64"
          - "$(BUILD_DIR)/../../../../../SourcePackages/artifacts/speechmarkdown-rust/SpeechMarkdownRust/ios-arm64"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]:
          - "$(BUILD_DIR)/../../SourcePackages/artifacts/speechmarkdown-rust/SpeechMarkdownRust/ios-arm64-simulator"
          - "$(BUILD_DIR)/../../../../../SourcePackages/artifacts/speechmarkdown-rust/SpeechMarkdownRust/ios-arm64-simulator"
        SWIFT_OBJC_BRIDGING_HEADER: DasherApp/Sources/DasherApp-Bridging-Header.h
    entitlements:
      path: DasherApp/DasherApp.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.application-groups:
          - group.at.dasher.Dasher

  DasherKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: DasherKeyboard
        excludes:
          - "**/.gitkeep"
      - path: DasherIcon.icon
        buildPhase: resources
      - path: DasherEngine/Resources/Data
        buildPhase: resources
        type: folder
    dependencies:
      - target: DasherCore_ios
        link: true
      - target: pugixml_ios
        link: true
    preBuildScripts:
      - name: Copy Locale Strings
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "${SRCROOT}/DasherEngine/Resources/Data/Strings"
          cp -f "${SRCROOT}/DasherCore/Strings/"*.json "${SRCROOT}/DasherEngine/Resources/Data/Strings/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.dasher.Dasher.Keyboard
        INFOPLIST_FILE: DasherKeyboard/Info.plist
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: DasherIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TRKU383G7Z
        OTHER_LDFLAGS:
          - "-lc++"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/DasherCore/src"
        SWIFT_OBJC_BRIDGING_HEADER: DasherKeyboard/Sources/DasherKeyboard-Bridging-Header.h
    entitlements:
      path: DasherKeyboard/DasherKeyboard.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.at.dasher.Dasher
        keychain-access-groups:
          - "$(AppIdentifierPrefix)at.dasher.Dasher"

  DasherMac:
    type: application
    platform: macOS
    sources:
      - path: DasherMac
        excludes:
          - "**/.gitkeep"
      - path: DasherApp/Resources/Colors.xcassets
        buildPhase: resources
      - path: DasherIcon.icon
        buildPhase: resources
      - path: DasherEngine/Resources/Data
        buildPhase: resources
        type: folder
    dependencies:
      - target: DasherCore_macos
        link: true
      - target: pugixml_macos
        link: true
      - package: DasherShared
        product: DasherShared
      - package: DasherSpeech
        product: DasherSpeech
    preBuildScripts:
      - name: Copy Locale Strings
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "${SRCROOT}/DasherEngine/Resources/Data/Strings"
          cp -f "${SRCROOT}/DasherCore/Strings/"*.json "${SRCROOT}/DasherEngine/Resources/Data/Strings/"
    settings:
      base:
        PRODUCT_NAME: "Dasher"
        PRODUCT_BUNDLE_IDENTIFIER: at.dasher.Dasher.macOS
        INFOPLIST_FILE: DasherMac/Info.plist
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: DasherIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TRKU383G7Z
        OTHER_LDFLAGS:
          - "-lc++"
          - "-lspeechmarkdown_rust"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/DasherCore/src"
        LIBRARY_SEARCH_PATHS:
          - "$(BUILD_DIR)/../../SourcePackages/artifacts/speechmarkdown-rust/SpeechMarkdownRust/macos-arm64_x86_64"
          - "$(BUILD_DIR)/../../../../../SourcePackages/artifacts/speechmarkdown-rust/SpeechMarkdownRust/macos-arm64_x86_64"
        SWIFT_OBJC_BRIDGING_HEADER: DasherMac/Sources/DasherMac-Bridging-Header.h
    entitlements:
      path: DasherMac/DasherMac.entitlements
      properties:
        com.apple.security.app-sandbox: true

  DasherVision:
    type: application
    platform: visionOS
    sources:
      - path: DasherVision
        excludes:
          - "**/.gitkeep"
      - path: DasherShared
      - path: DasherEngine/Resources/Data
        buildPhase: resources
        type: folder
    dependencies:
      - target: DasherCore_visionos
        link: true
      - target: pugixml_visionos
        link: true
      - package: SwiftTTSWrapper
        product: SwiftTTSWrapper
      - package: DasherSpeech
        product: DasherSpeech
    preBuildScripts:
      - name: Copy Locale Strings
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "${SRCROOT}/DasherEngine/Resources/Data/Strings"
          cp -f "${SRCROOT}/DasherCore/Strings/"*.json "${SRCROOT}/DasherEngine/Resources/Data/Strings/"
    settings:
      base:
        PRODUCT_NAME: "Dasher"
        PRODUCT_BUNDLE_IDENTIFIER: at.dasher.Dasher.vision
        INFOPLIST_FILE: DasherVision/Info.plist
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TRKU383G7Z
        OTHER_LDFLAGS:
          - "-lc++"
          - "-lspeechmarkdown_rust"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/DasherCore/src"
        LIBRARY_SEARCH_PATHS[sdk=xros*]:
          - "$(BUILD_DIR)/../../SourcePackages/artifacts/speechmarkdown-rust/SpeechMarkdownRust/xros-arm64"
          - "$(BUILD_DIR)/../../../../../SourcePackages/artifacts/speechmarkdown-rust/SpeechMarkdownRust/xros-arm64"
        LIBRARY_SEARCH_PATHS[sdk=xrsimulator*]:
          - "$(BUILD_DIR)/../../SourcePackages/artifacts/speechmarkdown-rust/SpeechMarkdownRust/xros-arm64-simulator"
          - "$(BUILD_DIR)/../../../../../SourcePackages/artifacts/speechmarkdown-rust/SpeechMarkdownRust/xros-arm64-simulator"
        SWIFT_OBJC_BRIDGING_HEADER: DasherVision/Sources/DasherVision-Bridging-Header.h
    entitlements:
      path: DasherVision/DasherVision.entitlements
      properties:
        com.apple.security.app-sandbox: false

schemes:
  DasherKeyboard:
    build:
      targets:
        DasherCore_ios: all
        pugixml_ios: all
        DasherKeyboard: all
    run:
      config: Debug
      askForAppToLaunch: true
    archive:
      config: Release
  DasherApp:
    build:
      targets:
        DasherKeyboard: all
        DasherCore_ios: all
        pugixml_ios: all
        DasherApp: all
    run:
      config: Debug
    archive:
      config: Release
  DasherMac:
    build:
      targets:
        DasherCore_macos: all
        pugixml_macos: all
        DasherMac: all
    run:
      config: Debug
    archive:
      config: Release
  DasherVision:
    build:
      targets:
        DasherCore_visionos: all
        pugixml_visionos: all
        DasherVision: all
    run:
      config: Debug
    archive:
      config: Release
