name: Dasher
options:
  bundleIdPrefix: org.dasherproject
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++

targetTemplates:
  DasherCoreTemplate:
    type: library.static
    sources:
      - path: DasherCore/src
        excludes:
          - "**/CannaConversionHelper.*"
          - "**/SocketInputBase.*"
          - "**/SocketInput.*"
          - "**/*.h"
          - "**/original_harness.c"
          - "**/harness.c"
      - path: DasherCore/src/dasher.h
        buildPhase: headers
        headerVisibility: public
    settings:
      base:
        PRODUCT_NAME: DasherCore
        GCC_PREPROCESSOR_DEFINITIONS:
          - HAVE_ROUND=1
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/DasherCore/src"
          - "$(SRCROOT)/DasherCore/src/DasherCore"
          - "$(SRCROOT)/DasherCore/Thirdparty/pugixml/src"

  PugixmlTemplate:
    type: library.static
    sources:
      - path: DasherCore/Thirdparty/pugixml/src
        includes:
          - "pugixml.cpp"
    settings:
      base:
        PRODUCT_NAME: pugixml

targets:
  pugixml_ios:
    platform: iOS
    templates: [PugixmlTemplate]

  pugixml_macos:
    platform: macOS
    templates: [PugixmlTemplate]

  DasherCore_ios:
    platform: iOS
    templates: [DasherCoreTemplate]
    dependencies:
      - target: pugixml_ios

  DasherCore_macos:
    platform: macOS
    templates: [DasherCoreTemplate]
    dependencies:
      - target: pugixml_macos

  DasherApp:
    type: application
    platform: iOS
    sources:
      - path: DasherApp
        excludes:
          - "**/.gitkeep"
      - path: DasherEngine/Resources/Data
        buildPhase: resources
        type: folder
    dependencies:
      - target: DasherCore_ios
        link: true
      - target: pugixml_ios
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dasherproject.Dasher
        INFOPLIST_FILE: DasherApp/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES
        OTHER_LDFLAGS:
          - "-lc++"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/DasherCore/src"
        SWIFT_OBJC_BRIDGING_HEADER: DasherApp/Sources/DasherApp-Bridging-Header.h
    entitlements:
      path: DasherApp/DasherApp.entitlements
      properties:
        com.apple.security.app-sandbox: false

  DasherKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: DasherKeyboard
        excludes:
          - "**/.gitkeep"
      - path: DasherEngine/Resources/Data
        buildPhase: resources
        type: folder
    dependencies:
      - target: DasherCore_ios
        link: true
      - target: pugixml_ios
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dasherproject.Dasher.Keyboard
        INFOPLIST_FILE: DasherKeyboard/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS:
          - "-lc++"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/DasherCore/src"
        SWIFT_OBJC_BRIDGING_HEADER: DasherKeyboard/Sources/DasherKeyboard-Bridging-Header.h
    entitlements:
      path: DasherKeyboard/DasherKeyboard.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - "$(AppIdentifierPrefix)org.dasherproject.Dasher"

  DasherMac:
    type: application
    platform: macOS
    sources:
      - path: DasherMac
        excludes:
          - "**/.gitkeep"
      - path: DasherEngine/Resources/Data
        buildPhase: resources
        type: folder
    dependencies:
      - target: DasherCore_macos
        link: true
      - target: pugixml_macos
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dasherproject.Dasher.macOS
        INFOPLIST_FILE: DasherMac/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        OTHER_LDFLAGS:
          - "-lc++"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/DasherCore/src"
        SWIFT_OBJC_BRIDGING_HEADER: DasherMac/Sources/DasherMac-Bridging-Header.h
    entitlements:
      path: DasherMac/DasherMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
