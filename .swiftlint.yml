opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - operator_usage_whitespace
  - sorted_first_last
  - toggle_bool

disabled_rules:
  - identifier_name
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - nesting
  - todo
  - trailing_comma
  - multiple_closures_with_trailing_closure
  - type_name

included:
  - DasherApp
  - DasherMac
  - DasherVision
  - DasherKeyboard
  - DasherShared
  - DasherSpeech

excluded:
  - DasherCore
  - DerivedData
  - .build
  - build

cyclomatic_complexity:
  warning: 20
  error: 30

force_cast:
  severity: warning
